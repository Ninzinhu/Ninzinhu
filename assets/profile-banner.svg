<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Ninzinhu — Coding, Cloud &amp; Cybersecurity</title>
  <desc id="desc">Cartão de João Victor em estilo terminal, com fundo escuro, detalhes verdes e azuis e símbolo de código.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#102831"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#58A6FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#58A6FF" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="352" rx="14" fill="#0D1117" fill-opacity=".55" stroke="#30363D"/>
  <path d="M24 66H1176" stroke="#30363D"/>
  <circle cx="48" cy="45" r="5" fill="#FF7B72"/><circle cx="68" cy="45" r="5" fill="#E3B341"/><circle cx="88" cy="45" r="5" fill="#3FB950"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="600" y="50" fill="#8B949E" font-size="14" text-anchor="middle">~/ninzinhu/profile</text>
    <text x="62" y="116" fill="#3FB950" font-size="18">$ whoami</text>
    <text x="58" y="193" fill="#F0F6FC" font-size="72" font-weight="700" letter-spacing="2">NINZINHU<tspan fill="#3FB950">_</tspan></text>
    <text x="63" y="232" fill="#C9D1D9" font-size="22">João Victor Emmanuell</text>
    <text x="63" y="281" fill="#58A6FF" font-size="21">CODING <tspan fill="#6E7681">/</tspan> <tspan fill="#A78BFA">CLOUD</tspan> <tspan fill="#6E7681">/</tspan> <tspan fill="#3FB950">CYBERSECURITY</tspan></text>
    <text x="63" y="339" fill="#8B949E" font-size="17">Construir. Entender. Proteger.</text>
  </g>
  <rect x="801" y="95" width="337" height="247" rx="16" fill="#0D1117" stroke="#30363D"/>
  <g transform="translate(970 181)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-52 48-32V3C48 34 24 54 0 67-24 54-48 34-48 3V-32Z" fill="#3FB950" fill-opacity=".05"/>
    <path d="M-17-8-30 6-17 20M17-8 30 6 17 20M6-16-6 27"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="970" y="282" fill="#E6EDF3" font-size="18" font-weight="700">BUILD · LEARN · SECURE</text>
    <text x="970" y="310" fill="#8B949E" font-size="15">curiosity is the starting point</text>
  </g>
  <rect x="63" y="357" width="240" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
